services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-efiche_billing}
      POSTGRES_USER: ${DB_USERNAME:-efiche}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-efiche_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-efiche} -d ${DB_DATABASE:-efiche_billing}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-eFiche Billing}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-efiche_billing}
      DB_USERNAME: ${DB_USERNAME:-efiche}
      DB_PASSWORD: ${DB_PASSWORD:-efiche_secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      EFICHEPAY_WEBHOOK_SECRET: ${EFICHEPAY_WEBHOOK_SECRET:-whsec_test_secret_key_change_in_production}
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api
      NEXT_PUBLIC_PAYMENT_POLL_INTERVAL: ${NEXT_PUBLIC_PAYMENT_POLL_INTERVAL:-5000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  postgres_data:
  backend_vendor:
  frontend_node_modules:
  frontend_next:
